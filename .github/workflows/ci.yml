name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilation et tests (PostgreSQL via Testcontainers)
        run: mvn -B verify
      # Le jar testé est celui qui sera déployé (compilé pour Java 17, comme le serveur)
      - name: Conserver le jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: okpost-jar
          path: backend/target/okpost.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Déploiement de l'API sur le VPS : seulement sur main, une fois les tests du backend et du frontend passés,
  # et seulement quand la variable de dépôt DEPLOY_VPS vaut « true » (à créer après l'installation, voir le README).
  # (L'interface est déployée par Vercel, qui suit la branche main.)
  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_VPS == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: okpost-jar
      - name: Préparer la connexion SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Envoyer le jar et redémarrer l'API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          OPTIONS="-i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes"
          scp $OPTIONS -P "$PORT" okpost.jar "$VPS_USER@$VPS_HOST:/opt/okpost/releases/okpost.jar"
          ssh $OPTIONS -p "$PORT" "$VPS_USER@$VPS_HOST" "sudo /usr/local/bin/okpost-deploy"
