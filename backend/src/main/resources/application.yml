spring:
  application:
    name: okpost
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/okpost}
    username: ${DB_USER:okpost}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_TLS:false}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8082}
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

okpost:
  url-publique: ${PUBLIC_URL:http://localhost:4200}
  cors-origines: ${CORS_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32+}
    acces-minutes: 15
    rafraichissement-jours: 7
  fichiers:
    dossier: ${FILES_DIR:./data/fichiers}
  mail:
    expediteur: ${MAIL_FROM:OkPost <no-reply@okpost.app>}
    actif: ${MAIL_ENABLED:false}
  validation:
    duree-jours: 30
  ia:
    # gemini | claude | compatible — valeur par défaut, remplaçable plus tard depuis l'administration
    fournisseur: ${IA_FOURNISSEUR:gemini}
    debit-par-minute: ${IA_DEBIT_MINUTE:8}
    lot-details: 5
    # délai maximum d'une réponse de l'IA, en secondes
    delai-secondes: ${IA_DELAI_SECONDES:240}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      modele: ${GEMINI_MODELE:gemini-3.5-flash-lite}
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      modele-strategie: ${CLAUDE_MODELE_STRATEGIE:claude-sonnet-5-5}
      modele-redaction: ${CLAUDE_MODELE_REDACTION:claude-haiku-5-5}
    image:
      fournisseur: ${IA_IMAGE_FOURNISSEUR:cloudflare}   # gemini | cloudflare
      modele: ${IA_IMAGE_MODELE:gemini-nano-banana-2.1}
      taille: ${IA_IMAGE_TAILLE:1K}
      # Cloudflare Workers AI : FLUX.1 schnell, quota gratuit chaque jour
      cloudflare-compte: ${CLOUDFLARE_ACCOUNT_ID:}
      cloudflare-jeton: ${CLOUDFLARE_API_TOKEN:}
      cloudflare-modele: ${CLOUDFLARE_MODELE:@cf/black-forest-labs/flux-1-schnell}

    # fournisseur « compatible » : n'importe quelle API compatible OpenAI (Groq par défaut)
    compatible:
      api-key: ${COMPATIBLE_API_KEY:}
      base-url: ${COMPATIBLE_BASE_URL:https://api.groq.com/openai}
      completions-path: ${COMPATIBLE_PATH:/v1/chat/completions}
      modele: ${COMPATIBLE_MODELE:openai/gpt-oss-120b}
    # Clé de chiffrement des jetons des réseaux sociaux (32 caractères ou plus, à ne jamais changer ensuite)
  cle-chiffrement: ${OKPOST_CLE_CHIFFREMENT:change-me-change-me-change-me-change-me}
  meta:
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    version: ${META_GRAPH_VERSION:v23.0}



springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/v3/api-docs
