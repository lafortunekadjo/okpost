# /etc/nginx/sites-available/okpost-api — puis : ln -s, certbot --nginx -d api.okpost.my2-0.cloud, nginx -t && systemctl reload nginx
# Le frontend est sur Vercel, qui relaie /api/* vers ce serveur : seule l'API est exposée ici.
server {
    listen 80;
    server_name api.okpost.my2-0.cloud;

    client_max_body_size 17m;

    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / { return 404; }
}
